[package]
name = "gpui_apple"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/gpui_apple.rs"
doctest = false

[features]
default = []
bench-support = ["gpui/bench-support"]
test-support = ["gpui/test-support"]
runtime_shaders = []

[dependencies]
gpui = { path = "../gpui", default-features = false }
[target.'cfg(target_os = "macos")'.dependencies]
anyhow = { version = "1.0.86" }
block2 = { version = "0.6" }
cocoa = { version = "=0.26.0" }
core-foundation = { version = "0.10" }
core-video = { version = "0.5.2", features = ["metal"] }
derive_more = { version = "2.1.1", features = ["add", "add_assign", "deref", "deref_mut", "display", "from", "from_str", "mul", "mul_assign", "not"] }
etagere = { version = "0.2" }
foreign-types = { version = "0.5" }
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
metal = { version = "0.33" }
objc = { version = "0.2" }
objc2 = { version = "0.6" }
parking_lot = { version = "0.12.1" }
[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen = { version = "0.28.0", default-features = false }
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }