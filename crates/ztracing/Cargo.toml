[package]
name = "ztracing"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
doctest = false

[features]
tracy = ["tracing-tracy", "tracy-client"]
web = ["dep:async-channel", "dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
zlog = { path = "../zlog" }
tracing = { version = "0.1.40" }
tracing-subscriber = "0.3.22"

ztracing_macro = { path = "../ztracing_macro" }
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tracing-tracy = { version = "0.11.4", optional = true, features = ["enable", "ondemand"] }
tracy-client = { version = "0.18.2", optional = true, features = ["enable", "ondemand"] }

[target.'cfg(target_family = "wasm")'.dependencies]
async-channel = { version = "2.5.0", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2.120", optional = true }
web-sys = { version = "0.3", features = ["console", "Performance"], optional = true }
